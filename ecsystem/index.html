<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منصة أثر</title>
  <link rel="preload" href="/athar.png" as="image" />
  <link rel="stylesheet" type="text/css" href="/loader.css" />
</head>

<body>
  <script>
    document.documentElement.classList.add('athar-initial-loading')

    window.dismissInitialLoader = function () {
      var el = document.getElementById('loading-bg')

      if (!el || el.dataset.dismissed === '1')
        return

      el.dataset.dismissed = '1'
      el.classList.add('athar-glass-loader--hide', 'athar-loader--hide')
      document.documentElement.classList.remove('athar-initial-loading')
      document.documentElement.style.overflow = ''
      document.body.style.overflow = ''
      window.setTimeout(function () { el.remove() }, 400)
    }
  </script>
  <div
    id="loading-bg"
    class="athar-glass-loader"
    role="status"
    aria-live="polite"
    aria-label="Loading"
  >
    <div class="athar-glass-loader__stage">
      <div
        class="athar-glass-loader__orbit"
        aria-hidden="true"
      >
        <svg
          class="athar-glass-loader__svg"
          viewBox="0 0 200 200"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <defs>
            <linearGradient
              id="athar-loader-track-gradient"
              x1="24"
              y1="24"
              x2="176"
              y2="176"
              gradientUnits="userSpaceOnUse"
            >
              <stop stop-color="#024282" />
              <stop
                offset="1"
                stop-color="#00A3FF"
              />
            </linearGradient>
          </defs>
          <circle
            class="athar-glass-loader__ring athar-glass-loader__ring--outer"
            cx="100"
            cy="100"
            r="96"
          />
          <circle
            class="athar-glass-loader__ring athar-glass-loader__ring--inner"
            cx="100"
            cy="100"
            r="88"
          />
          <circle
            class="athar-glass-loader__ticks athar-glass-loader__ticks--inactive"
            cx="100"
            cy="100"
            r="92"
          />
          <g class="athar-glass-loader__ticks-spin">
            <circle
              class="athar-glass-loader__ticks athar-glass-loader__ticks--active"
              cx="100"
              cy="100"
              r="92"
            />
          </g>
        </svg>
      </div>

      <div class="athar-glass-loader__glass">
        <img
          src="/athar.png"
          alt="Athar"
          class="athar-glass-loader__logo"
          width="136"
          height="136"
          decoding="async"
        >
      </div>
    </div>
  </div>
  <div id="app" />
  <script type="module" src="/src/main.js"></script>
  <script>
    (function () {
      var loaderBg = '#eef2f7'
      var blueDeep = '#024282'
      var blueBright = '#00A3FF'

      try {
        for (var i = 0; i < localStorage.length; i++) {
          var key = localStorage.key(i)

          if (key && key.endsWith('-initial-loader-bg'))
            loaderBg = localStorage.getItem(key) || loaderBg

          if (key && key.endsWith('-initial-loader-color'))
            blueDeep = localStorage.getItem(key) || blueDeep
        }

        loaderBg = localStorage.getItem('vuexy-initial-loader-bg') || loaderBg
        blueDeep = localStorage.getItem('vuexy-initial-loader-color') || blueDeep
      }
      catch (e) { /* ignore */ }

      document.documentElement.style.setProperty('--initial-loader-bg', loaderBg)
      document.documentElement.style.setProperty('--athar-loader-blue-deep', blueDeep)
      document.documentElement.style.setProperty('--initial-loader-color', blueDeep)
    })()

    window.addEventListener('load', function () {
      window.setTimeout(window.dismissInitialLoader, 4000)
    })
  </script>
</body>

</html>
